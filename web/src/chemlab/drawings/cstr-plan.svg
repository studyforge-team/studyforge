<circle cx="310" cy="220" r="130" fill="#f8fafc" stroke="#334155" stroke-width="4"/><circle cx="310" cy="220" r="112" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<g fill="#cbd5e1" stroke="#475569" stroke-width="2"><rect x="300" y="94" width="20" height="42" rx="2"/><rect x="300" y="304" width="20" height="42" rx="2"/><rect x="184" y="210" width="42" height="20" rx="2"/><rect x="394" y="210" width="42" height="20" rx="2"/></g>
