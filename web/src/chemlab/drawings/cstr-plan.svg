<path d="M180 130 L115 90 H55" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="78" font-family="Arial,sans-serif" font-size="14" fill="#334155">Baffle</text>
<text x="24" y="390" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Schematic only — not to scale; verify against team reference / IS SP 46.</text></svg>