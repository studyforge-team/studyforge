[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyforge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
"fastapi==0.143.0",
"uvicorn==0.54.0",
"pydantic==2.14.1",
"httpx==0.28.1",
"openai==1.109.1",
"pyyaml==6.0.3",
"pypdfium2==5.14.0",
"pillow==12.3.0",
"PyJWT[crypto]==2.10.1",
"cryptography==46.0.3",
"sqlalchemy[asyncio]==2.1.1",
"alembic==1.20.0",
"asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
"pytest==9.1.1",
"ruff==0.16.10",
"mypy==2.4.0",
"types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit/agent"]
testpaths = ["tests"]
