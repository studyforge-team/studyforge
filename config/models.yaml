# Model registry: the only place model IDs and prices live (plan rule 6).
# `id: null` = not confirmed yet. G10 fills every id and price from GET /v1/models;
# until then a null model is skipped in its role's chain.
# Prices are USD per 1M tokens.
# G10 (19 Oct 2026): IDs copied from GET /v1/models, prices from the Token Factory prices page
# (tokenfactory.nebius.com/organization/prices, eu-north1, before tax, non-batch).

base_url: https://api.tokenfactory.nebius.com/v1/
api_key_env: TF_API_KEY

models:
  nano:
    id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
    input_usd_per_m: 0.06
    output_usd_per_m: 0.24
  super:
    id: nvidia/nemotron-3-super-120b-a12b
    input_usd_per_m: 0.30
    output_usd_per_m: 0.90
  ultra:
    id: nvidia/Nemotron-3-Ultra-550b-a55b
    input_usd_per_m: 1.00
    output_usd_per_m: 3.00
  vision:
    id: nvidia/Nemotron-3.5-Super-VL
    input_usd_per_m: 0.30
    output_usd_per_m: 0.90

# models: tried in order (fallback chain). reasoning: thinking on/off for the call;
# leave it out to send no thinking flag. Vision is on (ACC1): printed-image set 11/12 vs
# 10/12 off, no confident misread of a dropped superscript minus; ~6 s not ~2 s per read.
# JSON calls always force it off.
roles:
  router:
    models: [nano, super]
    timeout_s: 5
    reasoning: false
    max_tokens: 256
  solver:
    models: [ultra, super]  # ACC2: Ultra (550B) solves, Super is the fallback; held-out 46/48 vs 44/48
    timeout_s: 90
    reasoning: true
    temperature: 1.0
    top_p: 0.95
    max_tokens: 16000
  cross_check:
    models: [ultra, super]
    timeout_s: 90
    reasoning: true
    temperature: 1.0
    top_p: 0.95
    max_tokens: 16000
  vision:
    models: [vision]
    timeout_s: 75  # under the browser's 90 s limit on the read call
    reasoning: true
    max_tokens: 12000  # a long page used ~7200 with thinking; 4000 cut it off
