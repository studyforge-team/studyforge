name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            chemlab/pyproject.toml
      # api tests import chemlab, so install it first
      - run: pip install -e "./chemlab[dev]" -e "./api[dev]"
      - run: ruff check .
        working-directory: api
      - run: mypy app
        working-directory: api
      - run: pytest -q
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      - run: pytest -q
        working-directory: chemlab

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      # build = copy-pyodide (wheels from jsDelivr, sha256-checked) + tsc -b + vite build
      - run: npm run build
        working-directory: web
      - run: node tests/check-v2da.mjs
        working-directory: web
      - run: node --test tests/errors.test.ts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # webServer in playwright.config.ts rebuilds and serves on :4192
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
